<svg viewBox="0 0 680 160" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono', 'Courier New', monospace">

  <!-- You + AI tool -->
  <rect x="10" y="40" width="124" height="56" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="72" y="63" text-anchor="middle" font-size="10" font-weight="600" fill="#9d174d">YOU + AI TOOL</text>
  <text x="72" y="80" text-anchor="middle" font-size="9.5" fill="#6b7280">write &amp; edit code</text>

  <!-- Arrow -->
  <line x1="134" y1="68" x2="158" y2="68" stroke="#9ca3af" stroke-width="1.5"/>
  <polygon points="154,64 164,68 154,72" fill="#9ca3af"/>

  <!-- GitHub Desktop -->
  <rect x="164" y="40" width="124" height="56" rx="4" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="226" y="63" text-anchor="middle" font-size="10" font-weight="600" fill="#374151">GITHUB DESKTOP</text>
  <text x="226" y="80" text-anchor="middle" font-size="9.5" fill="#6b7280">commit · push</text>

  <!-- Arrow -->
  <line x1="288" y1="68" x2="312" y2="68" stroke="#9ca3af" stroke-width="1.5"/>
  <polygon points="308,64 318,68 308,72" fill="#9ca3af"/>

  <!-- GitHub -->
  <rect x="318" y="40" width="110" height="56" rx="4" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="373" y="63" text-anchor="middle" font-size="10" font-weight="600" fill="#374151">GITHUB</text>
  <text x="373" y="80" text-anchor="middle" font-size="9.5" fill="#6b7280">codebase</text>

  <!-- Arrow -->
  <line x1="428" y1="68" x2="452" y2="68" stroke="#9ca3af" stroke-width="1.5"/>
  <polygon points="448,64 458,68 448,72" fill="#9ca3af"/>

  <!-- Vercel -->
  <rect x="458" y="40" width="110" height="56" rx="4" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="513" y="63" text-anchor="middle" font-size="10" font-weight="600" fill="#374151">VERCEL</text>
  <text x="513" y="80" text-anchor="middle" font-size="9.5" fill="#6b7280">live site</text>

  <!-- Visitor submits → Web3Forms/Apps Script loop -->
  <!-- Down from Vercel -->
  <line x1="513" y1="96" x2="513" y2="130" stroke="#db2777" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="509,126 513,136 517,126" fill="#db2777"/>

  <!-- Web3Forms / Apps Script box -->
  <rect x="418" y="136" width="190" height="18" rx="3" fill="#fce7f3" stroke="#db2777" stroke-width="1"/>
  <text x="513" y="149" text-anchor="middle" font-size="9.5" fill="#9d174d">Web3Forms · Apps Script</text>

  <!-- label for dashed -->
  <text x="530" y="120" font-size="9" fill="#db2777">visitor submits form</text>

  <!-- Up arrow back to GitHub (loop) -->
  <line x1="418" y1="145" x2="373" y2="145" stroke="#db2777" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="373" y1="145" x2="373" y2="96" stroke="#db2777" stroke-width="1.5" stroke-dasharray="4 3"/>

</svg>
