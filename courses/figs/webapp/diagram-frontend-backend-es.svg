  <rect x="48" y="160" width="300" height="28" rx="3" fill="white" stroke="#6b7280" stroke-width="1"/>
  <text x="198" y="179" text-anchor="middle" font-size="11" fill="#1f2937">código del servidor — lógica · auth · búsqueda</text>

  <line x1="348" y1="174" x2="380" y2="174" stroke="#6b7280" stroke-width="1.5"/>
  <polygon points="376,170 386,174 376,178" fill="#6b7280"/>

  <rect x="380" y="160" width="192" height="28" rx="3" fill="white" stroke="#6b7280" stroke-width="1"/>
