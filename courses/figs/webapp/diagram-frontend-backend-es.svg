<svg viewBox="0 0 640 220" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono', 'Courier New', monospace">

  <!-- FRONTEND box -->
  <rect x="20" y="16" width="600" height="72" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="320" y="38" text-anchor="middle" font-size="10" font-weight="600" fill="#9d174d" letter-spacing="0.08em">FRONTEND — corre en el navegador del visitante</text>
  <rect x="48"  y="50" width="156" height="28" rx="3" fill="white" stroke="#db2777" stroke-width="1"/>
  <rect x="234" y="50" width="156" height="28" rx="3" fill="white" stroke="#db2777" stroke-width="1"/>
  <rect x="420" y="50" width="172" height="28" rx="3" fill="white" stroke="#db2777" stroke-width="1"/>
  <text x="126" y="69" text-anchor="middle" font-size="11" fill="#1f2937">HTML — contenido</text>
  <text x="312" y="69" text-anchor="middle" font-size="11" fill="#1f2937">CSS — estilo</text>
  <text x="506" y="69" text-anchor="middle" font-size="11" fill="#1f2937">JS — funcionalidad</text>

  <!-- Arrow down -->
