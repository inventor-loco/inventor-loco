<svg viewBox="0 0 640 210" xmlns="http://www.w3.org/2000/svg" font-family="'IBM Plex Mono', 'Courier New', monospace">

  <!-- FRONTEND -->
  <rect x="10" y="10" width="200" height="60" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="110" y="32" text-anchor="middle" font-size="10" font-weight="600" fill="#9d174d">FRONTEND (navegador)</text>
  <text x="110" y="52" text-anchor="middle" font-size="10" fill="#374151">HTML · CSS · JS</text>

  <!-- Double arrow FRONTEND ↔ BACKEND -->
  <line x1="210" y1="40" x2="284" y2="40" stroke="#9ca3af" stroke-width="1.5"/>
  <polygon points="206,36 196,40 206,44" fill="#9ca3af"/>
  <polygon points="280,36 290,40 280,44" fill="#9ca3af"/>

  <!-- BACKEND -->
  <rect x="290" y="10" width="200" height="60" rx="4" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="390" y="32" text-anchor="middle" font-size="10" font-weight="600" fill="#374151">BACKEND (delegado)</text>
  <text x="390" y="52" text-anchor="middle" font-size="9.5" fill="#374151">Web3Forms · Apps Script</text>

  <!-- Arrow down from FRONTEND to GitHub -->
  <line x1="110" y1="70" x2="110" y2="106" stroke="#db2777" stroke-width="1.5"/>
  <polygon points="106,102 110,112 114,102" fill="#db2777"/>

  <!-- GITHUB -->
  <rect x="10" y="112" width="200" height="52" rx="4" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="110" y="133" text-anchor="middle" font-size="10" font-weight="600" fill="#374151">GitHub</text>
  <text x="110" y="150" text-anchor="middle" font-size="9"  fill="#6b7280">repositorio</text>

  <!-- Arrow GitHub → Vercel -->
  <line x1="210" y1="138" x2="274" y2="138" stroke="#9ca3af" stroke-width="1.5"/>
  <polygon points="270,134 280,138 270,142" fill="#9ca3af"/>

  <!-- VERCEL -->
  <rect x="280" y="112" width="160" height="52" rx="4" fill="#f9fafb" stroke="#6b7280" stroke-width="1.5"/>
  <text x="360" y="133" text-anchor="middle" font-size="10" font-weight="600" fill="#374151">Vercel</text>
  <text x="360" y="150" text-anchor="middle" font-size="9"  fill="#6b7280">despliegue automático</text>

  <!-- Arrow Vercel → live URL -->
  <line x1="440" y1="138" x2="494" y2="138" stroke="#9ca3af" stroke-width="1.5"/>
  <polygon points="490,134 500,138 490,142" fill="#9ca3af"/>

  <!-- LIVE URL -->
  <rect x="500" y="112" width="130" height="52" rx="4" fill="#f0fdf4" stroke="#059669" stroke-width="1.5"/>
  <text x="565" y="133" text-anchor="middle" font-size="10" font-weight="600" fill="#065f46">URL en vivo</text>
  <text x="565" y="150" text-anchor="middle" font-size="9"  fill="#6b7280">*.vercel.app</text>

  <!-- Up arrow from You+AI → GitHub -->
  <line x1="110" y1="164" x2="110" y2="198" stroke="#db2777" stroke-width="1.5" stroke-dasharray="4 3"/>
  <polygon points="106,112 110,112 114,112" fill="none"/><!-- spacer -->
  <polygon points="106,110 110,112 114,110" fill="#db2777"/>

  <!-- YOU + AI TOOL (loop banner) -->
  <rect x="10" y="178" width="620" height="30" rx="4" fill="#fce7f3" stroke="#db2777" stroke-width="1.5"/>
  <text x="320" y="198" text-anchor="middle" font-size="10" font-weight="600" fill="#9d174d">Tú + IA → prompt → prueba → commit → push → verifica  ↺</text>

  <!-- Up arrow to GitHub from the loop -->
  <line x1="110" y1="178" x2="110" y2="166" stroke="#db2777" stroke-width="1.5"/>
  <polygon points="106,170 110,164 114,170" fill="#db2777"/>

</svg>
